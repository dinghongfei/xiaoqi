baseURL = 'http://127.0.0.1:1314/'
title = '演示站点'
theme = 'plain'
defaultContentLanguage = 'zh-cn'
disableKinds = ['taxonomy', 'term', 'RSS']

[params]
  accent = '#EB6106'
  description = '这是一个演示站点'
  # 语言切换入口。演示站暂时隐藏；改 true 即显示 EN / 中文，多语言内容仍会构建。
  show_i18n = false

[languages.zh-cn]
label = '简体中文'
languageName = '简体中文'
weight = 1
contentDir = 'content/zh-cn'
[languages.zh-cn.params]
  tagline = '演示站点'

[languages.en]
label = 'English'
languageName = 'English'
weight = 2
contentDir = 'content/en'
[languages.en.params]
  tagline = 'Demo site'

[markup.highlight]
  noClasses = true
  style = 'github'

[markup.goldmark.renderer]
  unsafe = true
