<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>:root { --color-accent: {{ site.Params.accent | default "#EB6106" }}; }</style>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body class="is-inner is-research{{ if .IsPage }} is-research-post{{ end }}">
  <header class="site-header">
    <div class="site-header__left">
      <a class="site-header__logo" href="{{ "/" | relLangURL }}">{{ site.Title }}</a>
      <a class="btn-primary" href="{{ "/blog/" | relLangURL }}">{{ if eq site.Language.Lang "en" }}Research{{ else }}演示博客{{ end }}</a>
    </div>
    {{ if site.Params.show_i18n }}
    <div class="site-header__right">
      {{ if eq site.Language.Lang "zh-cn" }}
      <a class="btn-primary" href="{{ "/en/" | relURL }}">EN</a>
      {{ else }}
      <a class="btn-primary" href="{{ "/" | relURL }}">中文</a>
      {{ end }}
    </div>
    {{ end }}
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">{{ site.Params.description }}</footer>
</body>
</html>
