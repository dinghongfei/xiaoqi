[project]
name = "bot"
version = "0.1.0"
description = "Feishu IM adapter that delegates to a local Agent CLI and portable skills"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "lark-oapi>=1.4.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0",
    "markdown>=3.7",
    "pygments>=2.18",
]

[project.scripts]
bot = "bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
